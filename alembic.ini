# Alembic configuration for the product database (db/).
# The database URL is NOT set here: db/migrations/env.py reads it from the app
# settings (DATABASE_URL, or sqlite:///<STORAGE_DIR>/app.db when empty), so
# `alembic upgrade head` and `python -m db.cli upgrade` hit the same database
# as the running app.

[alembic]
script_location = db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
